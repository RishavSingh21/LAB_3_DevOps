services:
  app-logs-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/log/lab3"]
    volumes:
      - app-logs:/var/log/lab3
    restart: "no"
    networks:
      - lab3

  app:
    build:
      context: .
    environment:
      FEATURE_GREETING_V2: ${FEATURE_GREETING_V2:-false}
    ports:
      - "5000:5000"
    volumes:
      - app-logs:/var/log/lab3
    networks:
      - lab3
    depends_on:
      app-logs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - lab3
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lab3admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - lab3
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - lab3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    networks:
      - lab3
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/var/log/lab3:ro
    networks:
      - lab3
    depends_on:
      - logstash

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    networks:
      - lab3
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  app-logs:

networks:
  lab3:
    external: true
    name: lab3-monitoring
